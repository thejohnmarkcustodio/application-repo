name: Build, Scan, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and tag Docker image
        run: |
          docker build -t my-dockerhub/my-app:latest .
          docker tag my-dockerhub/my-app:latest my-dockerhub/my-app:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-dockerhub/my-app:${{ github.sha }}'
          format: 'table'

      - name: Push Docker image
        run: |
          docker push my-dockerhub/my-app:${{ github.sha }}
          docker push my-dockerhub/my-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Login to ArgoCD
        run: argocd login ${{ secrets.ARGOCD_SERVER }} --username ${{ secrets.ARGOCD_USERNAME }} --password ${{ secrets.ARGOCD_PASSWORD }} --insecure

      - name: Update ArgoCD Application Image
        run: |
          argocd app set my-helm-app --helm-set image.repository=my-dockerhub/my-app --helm-set image.tag=${{ github.sha }}
          argocd app sync my-helm-app
